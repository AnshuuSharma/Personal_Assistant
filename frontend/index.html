<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anshu Sharma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f0f;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --bg4: #2e2e2e;
  --line: rgba(255,255,255,0.08);
  --line2: rgba(255,255,255,0.13);
  --t1: #f0ede8;
  --t2: #8a8780;
  --t3: #454540;
  --acc: #d4a853;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  overflow: hidden;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.topbar-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--t2);
  letter-spacing: 0.02em;
}

.topbar-links {
  display: flex;
  gap: 20px;
}

.topbar-links a {
  font-size: 12px;
  color: var(--t3);
  text-decoration: none;
  letter-spacing: 0.02em;
}

.topbar-links a:hover { color: var(--t2); }

/* ── MAIN CONTENT ── */
.main {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: var(--bg3) transparent;
}

.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb { background: var(--bg3); }

/* ── HOME VIEW ── */
.home {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 40px 24px;
  min-height: 100%;
}

.greeting {
  text-align: center;
  margin-bottom: 40px;
}

.greeting-sub {
  font-size: 13px;
  color: var(--t2);
  font-weight: 400;
  margin-bottom: 8px;
  letter-spacing: 0.03em;
}

.greeting-main {
  font-size: 32px;
  font-weight: 600;
  color: var(--t1);
  letter-spacing: -0.5px;
  line-height: 1.2;
}

.greeting-main span {
  color: var(--acc);
  font-weight: 300;
  font-style: italic;
}

.search-wrap {
  width: 100%;
  max-width: 600px;
  margin-bottom: 32px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 12px;
  padding: 14px 50px 14px 18px;
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}

.search-wrap input::placeholder { color: var(--t3); }

.search-wrap input:focus {
  border-color: rgba(212,168,83,0.35);
}

.search-send {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--t2);
  font-size: 14px;
  transition: all 0.15s;
}

.search-send:hover {
  background: var(--bg4);
  color: var(--t1);
}

.search-send:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.cards-label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
  width: 100%;
  max-width: 600px;
  margin-bottom: 10px;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  max-width: 600px;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card:hover {
  border-color: var(--line2);
  background: var(--bg3);
}

.card.resumeiq {
  border-color: rgba(212,168,83,0.2);
}

.card.resumeiq:hover {
  border-color: rgba(212,168,83,0.4);
  background: rgba(212,168,83,0.05);
}

.card-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--t1);
}

.card.resumeiq .card-title { color: var(--acc); }

.card-sub {
  font-size: 11px;
  color: var(--t3);
  line-height: 1.4;
}

/* ── CHAT VIEW ── */
.chat-view {
  display: none;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.chat-view.active {
  display: flex;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--bg3) transparent;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--bg3); }

.msg-wrap {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding-left: 24px;
  padding-right: 24px;
}

.msg-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.msg-wrap.user .msg-label { color: var(--t2); }
.msg-wrap.assistant .msg-label { color: var(--acc); }

.msg-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--t1);
}

.msg-wrap.user .msg-text { color: var(--t2); }

.typing-wrap {
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
}

.typing-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--acc);
  margin-bottom: 8px;
}

.dots {
  display: flex;
  gap: 4px;
}

.dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--t3);
  animation: blink 1.1s ease-in-out infinite;
}

.dots span:nth-child(2) { animation-delay: 0.18s; }
.dots span:nth-child(3) { animation-delay: 0.36s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

/* ── JD BLOCK ── */
.jd-wrap {
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
}

.jd-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--acc);
  margin-bottom: 10px;
}

.jd-wrap textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 10px;
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  padding: 12px 14px;
  resize: none;
  height: 120px;
  outline: none;
  margin-bottom: 8px;
  transition: border-color 0.15s;
}

.jd-wrap textarea:focus { border-color: rgba(212,168,83,0.3); }
.jd-wrap textarea::placeholder { color: var(--t3); }

.jd-submit {
  background: var(--acc);
  border: none;
  border-radius: 8px;
  color: #0f0f0f;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 16px;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: opacity 0.15s;
}

.jd-submit:hover { opacity: 0.85; }
.jd-submit:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── BOTTOM INPUT (chat mode) ── */
.chat-input {
  border-top: 1px solid var(--line);
  padding: 16px 24px 20px;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
}

.chat-input-inner {
  width: 100%;
  max-width: 680px;
  position: relative;
}

.chat-input-inner textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 12px;
  padding: 12px 50px 12px 16px;
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  height: 46px;
  max-height: 120px;
  outline: none;
  transition: border-color 0.15s;
}

.chat-input-inner textarea:focus {
  border-color: rgba(212,168,83,0.3);
}

.chat-input-inner textarea::placeholder { color: var(--t3); }

.chat-send {
  position: absolute;
  right: 10px;
  bottom: 8px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--t2);
  transition: all 0.15s;
}

.chat-send:hover {
  background: var(--bg4);
  color: var(--t1);
}

.chat-send:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.back-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  color: var(--t2);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.back-btn:hover {
  border-color: var(--line2);
  color: var(--t1);
}

.agent-orb {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  margin: 0 auto 24px;

  background:
    radial-gradient(circle at 30% 30%,
      #f0c8ff 0%,
      #c96cff 25%,
      #8b5cf6 55%,
      #5b21b6 100%);

  box-shadow:
    0 0 18px rgba(168, 85, 247, 0.55),
    0 0 40px rgba(139, 92, 246, 0.35),
    inset 0 0 12px rgba(255,255,255,0.25);

  position: relative;

  animation:
    floatOrb 4s ease-in-out infinite,
    pulseGlow 3s ease-in-out infinite;
}

/* glossy reflection */
.agent-orb::before {
  content: "";
  position: absolute;
  top: 10px;
  left: 14px;
  width: 20px;
  height: 20px;
  border-radius: 50%;

  background: rgba(255,255,255,0.45);
  filter: blur(2px);
}

/* outer glow ring */
.agent-orb::after {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(192,132,252,0.25);
}

/* floating animation */
@keyframes floatOrb {
  0%,100% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-6px);
  }
}

/* glow animation */
@keyframes pulseGlow {
  0%,100% {
    box-shadow:
      0 0 18px rgba(168, 85, 247, 0.55),
      0 0 40px rgba(139, 92, 246, 0.35),
      inset 0 0 12px rgba(255,255,255,0.25);
  }

  50% {
    box-shadow:
      0 0 28px rgba(192,132,252,0.75),
      0 0 60px rgba(139,92,246,0.5),
      inset 0 0 16px rgba(255,255,255,0.35);
  }
}
</style>
</head>
<body>

<div class="shell">

  <div class="topbar">
    <span class="topbar-name">Anshu Sharma</span>
    <div class="topbar-links">
      <a href="https://www.linkedin.com/in/anshu-sharma-33b979268/" target="_blank">LinkedIn ↗</a>
      <a href="https://agentic-resume-analyzer.netlify.app/" target="_blank">ResumeIQ ↗</a>
      <a href="mailto:anshusharma27165@gmail.com">Email ↗</a>
    </div>
  </div>

  <div class="main" id="main">

    <!-- HOME -->
    <div class="home" id="home-view">
      <div class="greeting">
        <div class="agent-orb"></div>
        <div class="greeting-sub">AI / ML Engineer · Pune, India</div>
        <div class="greeting-main">Hi, I'm Anshu's<br><span>AI assistant.</span></div>
      </div>

      <div class="search-wrap">
        <input
          type="text"
          id="home-input"
          placeholder="Ask anything about Anshu..."
          onkeydown="homeKey(event)"
        />
        <button class="search-send" id="home-send" onclick="homeSubmit()">↑</button>
      </div>

      <div class="cards-label">or get started with</div>

      <div class="cards">
        <button class="card" onclick="cardClick('skills')">
          <div class="card-title">Skills</div>
          <div class="card-sub">Languages, frameworks & AI stack</div>
        </button>
        <button class="card" onclick="cardClick('education')">
          <div class="card-title">Education</div>
          <div class="card-sub">Academic background & scores</div>
        </button>
        <button class="card" onclick="cardClick('projects')">
          <div class="card-title">Projects</div>
          <div class="card-sub">ResumeIQ, Smart Banking & more</div>
        </button>
        <button class="card resumeiq" onclick="showChat(); showJD()">
          <div class="card-title">Check fit for your JD →</div>
          <div class="card-sub">Paste a JD to run ATS analysis</div>
        </button>
      </div>
    </div>

    <!-- CHAT -->
    <div class="chat-view" id="chat-view">
      <div style="max-width:680px;width:100%;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0;">
        <span style="font-size:12px;color:var(--t3);">conversation</span>
        <button class="back-btn" onclick="goHome()">← new session</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="chat-input">
        <div class="chat-input-inner">
          <textarea
            id="chat-inp"
            placeholder="Ask something..."
            onkeydown="chatKey(event)"
            oninput="resizeTA(this)"
          ></textarea>
          <button class="chat-send" id="chat-send" onclick="chatSubmit()">↑</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:8000';
let busy = false;
let jdOpen = false;

function sid() {
  let s = localStorage.getItem('_asid');
  if (!s) { s = 'sx' + Math.random().toString(36).slice(2,10); localStorage.setItem('_asid', s); }
  return s;
}

function resizeTA(el) {
  el.style.height = '46px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function homeKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); homeSubmit(); }
}

function chatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSubmit(); }
}

function showChat() {
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('chat-view').classList.add('active');
}

function goHome() {
  document.getElementById('chat-view').classList.remove('active');
  document.getElementById('home-view').style.display = '';
  document.getElementById('messages').innerHTML = '';
  jdOpen = false;
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function addMsg(who, text) {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg-wrap ' + who;
  d.innerHTML = `
    <div class="msg-label">${who === 'user' ? 'you' : 'anshu.ai'}</div>
    <div class="msg-text">${text.replace(/\n/g,'<br>')}</div>
  `;
  m.appendChild(d);
  scrollBottom();
}

function showTyping() {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'typing-wrap typ';
  // d.id = 'typ';
  d.innerHTML = `<div class="typing-label">anshu.ai</div><div class="dots"><span></span><span></span><span></span></div>`;
  m.appendChild(d);
  scrollBottom();
}

function removeTyping() {
  // const el = document.getElementById('typ');
  // if (el) el.remove();
  document
  .querySelectorAll('.typ')
  .forEach(el => el.remove());
}

function setBusy(v) {
  busy = v;
  const cs = document.getElementById('chat-send');
  const ci = document.getElementById('chat-inp');
  const hs = document.getElementById('home-send');
  if (cs) cs.disabled = v;
  if (ci) ci.disabled = v;
  if (hs) hs.disabled = v;
}

async function homeSubmit() {
  const inp = document.getElementById('home-input');
  const txt = inp.value.trim();
  if (!txt || busy) return;
  inp.value = '';
  showChat();
  await doChat(txt);
}

async function chatSubmit() {
  const inp = document.getElementById('chat-inp');
  const txt = inp.value.trim();
  if (!txt || busy) return;
  inp.value = '';
  inp.style.height = '46px';
  await doChat(txt);
}

async function doChat(txt) {
  addMsg('user', txt);
  showTyping();
  setBusy(true);
  try {
    const r = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: txt, session_id: sid()})
    });
    const d = await r.json();
    removeTyping();
    addMsg('assistant', d.response);
  } catch {
    removeTyping();
    addMsg('assistant', 'Something went wrong — please try again.');
  }
  setBusy(false);
}

async function cardClick(topic) {
  showChat();
  
   await new Promise(resolve => setTimeout(resolve, 50));
  
  showTyping();
  setBusy(true);
  try {
    const r = await fetch(`${API}/button`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({topic, session_id: sid()})
    });
    const d = await r.json();
    removeTyping();
    addMsg('assistant', d.response);
  } catch {
    removeTyping();
    addMsg('assistant', 'Something went wrong — please try again.');
  }
  setBusy(false);
}

function showJD() {
  if (jdOpen) return;
  jdOpen = true;
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'jd-wrap';
  d.id = 'jd-block';
  d.innerHTML = `
    <div class="jd-label">paste job description</div>
    <textarea id="jd-txt" placeholder="Paste the full JD — requirements, responsibilities, skills needed..."></textarea>
    <button class="jd-submit" id="jd-go" onclick="submitJD()">Run ResumeIQ analysis →</button>
  `;
  m.appendChild(d);
  scrollBottom();
  document.getElementById('jd-txt').focus();
}

async function submitJD() {
  const jd = document.getElementById('jd-txt').value.trim();
  if (!jd || busy) return;
  document.getElementById('jd-block').remove();
  jdOpen = false;
  addMsg('user', 'JD submitted for analysis');
  addMsg('assistant', 'Running ResumeIQ — this may take up to 30s on first load...');
  setBusy(true);

  try {
    const r = await fetch(`${API}/analyze`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({job_description: jd, session_id: sid()})
    });
    const d = await r.json();
    addMsg('assistant', d.response);
  } catch {
    addMsg('assistant', 'ResumeIQ is waking up — please try again in a moment.');
  }
  setBusy(false);
}
</script>
</body>
</html>
