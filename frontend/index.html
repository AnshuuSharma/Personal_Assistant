<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anshu Sharma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #0f0f0f;
  --bg2:  #1a1a1a;
  --bg3:  #242424;
  --bg4:  #2e2e2e;
  --line:  rgba(255,255,255,0.08);
  --line2: rgba(255,255,255,0.13);
  --t1: #f0ede8;
  --t2: #8a8780;
  --t3: #454540;
  --acc: #d4a853;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  overflow: hidden;
}

/* ── SHELL ── */
.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.topbar-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--t2);
  letter-spacing: 0.02em;
}

.topbar-links { display: flex; gap: 20px; }

.topbar-links a {
  font-size: 12px;
  color: var(--t3);
  text-decoration: none;
}

.topbar-links a:hover { color: var(--t2); }

/* ── VIEWS CONTAINER ── */
.views {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;  /* ADD THIS */
}

#home-view {
  position: absolute;
  inset: 0;          /* top:0 right:0 bottom:0 left:0 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  overflow-y: auto;
}

#home-view.gone { display: none; }

.agent-orb {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  margin: 0 auto 20px;
  background: radial-gradient(circle at 30% 30%, #f0c8ff 0%, #c96cff 25%, #8b5cf6 55%, #5b21b6 100%);
  box-shadow: 0 0 18px rgba(168,85,247,0.55), 0 0 40px rgba(139,92,246,0.35), inset 0 0 12px rgba(255,255,255,0.25);
  position: relative;
}

.agent-orb::before {
  content: "";
  position: absolute;
  top: 10px; left: 14px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  filter: blur(2px);
}

.greeting { text-align: center; margin-bottom: 40px; }

.greeting-sub {
  font-size: 13px;
  color: var(--t2);
  margin-bottom: 8px;
  letter-spacing: 0.03em;
}

.greeting-main {
  font-size: 32px;
  font-weight: 600;
  color: var(--t1);
  letter-spacing: -0.5px;
  line-height: 1.2;
}

.greeting-main span {
  color: var(--acc);
  font-weight: 300;
  font-style: italic;
}

.search-wrap {
  width: 100%;
  max-width: 600px;
  margin-bottom: 32px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 12px;
  padding: 14px 50px 14px 18px;
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}

.search-wrap input::placeholder { color: var(--t3); }
.search-wrap input:focus { border-color: rgba(212,168,83,0.35); }

.search-send {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--t2);
  font-size: 14px;
  transition: all 0.15s;
}

.search-send:hover { background: var(--bg4); color: var(--t1); }
.search-send:disabled { opacity: 0.3; cursor: not-allowed; }

.cards-label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
  width: 100%;
  max-width: 600px;
  margin-bottom: 10px;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  max-width: 600px;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card:hover { border-color: var(--line2); background: var(--bg3); }
.card.resumeiq { border-color: rgba(212,168,83,0.2); }
.card.resumeiq:hover { border-color: rgba(212,168,83,0.4); background: rgba(212,168,83,0.05); }
.card-title { font-size: 13px; font-weight: 500; color: var(--t1); }
.card.resumeiq .card-title { color: var(--acc); }
.card-sub { font-size: 11px; color: var(--t3); line-height: 1.4; }

/* ── CHAT VIEW ── */
#chat-view {
  position: absolute;
  inset: 0;         
  display: none;
  flex-direction: column;
  overflow: hidden;
}

#chat-view.visible { display: flex; }

.chat-toolbar {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 10px 24px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.back-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  color: var(--t3);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}

.back-btn:hover { border-color: var(--line2); color: var(--t2); }

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.qt-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 10px;
  color: var(--t3);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.qt-btn:hover { border-color: var(--line2); color: var(--t2); }

.qt-btn.acc {
  border-color: rgba(212,168,83,0.25);
  color: var(--acc);
}

.qt-btn.acc:hover {
  border-color: rgba(212,168,83,0.5);
  background: rgba(212,168,83,0.05);
}

.messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: var(--bg3) transparent;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--bg3); }

.msg-wrap {
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
}

.msg-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.msg-wrap.user .msg-label { color: var(--t2); }
.msg-wrap.assistant .msg-label { color: var(--acc); }
.msg-text { font-size: 14px; line-height: 1.7; color: var(--t1); }
.msg-wrap.user .msg-text { color: var(--t2); }

/* markdown */
.msg-wrap.assistant .msg-text h3 {
  color: var(--t1);
  font-size: 14px;
  font-weight: 600;
  margin: 16px 0 6px;
  line-height: 1.3;
}

.msg-wrap.assistant .msg-text p { margin: 0 0 10px; line-height: 1.7; }

.msg-wrap.assistant .msg-text ul,
.msg-wrap.assistant .msg-text ol {
  margin: 4px 0 10px 18px;
  line-height: 1.7;
}

.msg-wrap.assistant .msg-text li { margin-bottom: 4px; }

.msg-wrap.assistant .msg-text strong {
  color: var(--t1);
  font-weight: 600;
}

.msg-wrap.assistant .msg-text code {
  background: var(--bg3);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px;
  color: var(--acc);
}

.msg-wrap.assistant .msg-text > *:first-child { margin-top: 0; }

/* typing */
.typing-wrap {
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
}

.typing-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--acc);
  margin-bottom: 8px;
}

.dots { display: flex; gap: 4px; }

.dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--t3);
  animation: blink 1.1s ease-in-out infinite;
}

.dots span:nth-child(2) { animation-delay: 0.18s; }
.dots span:nth-child(3) { animation-delay: 0.36s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

/* jd block */
.jd-wrap {
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
}

.jd-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--acc);
  margin-bottom: 10px;
}

.jd-wrap textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 10px;
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  padding: 12px 14px;
  resize: none;
  height: 120px;
  outline: none;
  margin-bottom: 8px;
  transition: border-color 0.15s;
}

.jd-wrap textarea:focus { border-color: rgba(212,168,83,0.3); }
.jd-wrap textarea::placeholder { color: var(--t3); }

.jd-submit {
  background: var(--acc);
  border: none;
  border-radius: 8px;
  color: #0f0f0f;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 16px;
  cursor: pointer;
  transition: opacity 0.15s;
}

.jd-submit:hover { opacity: 0.85; }
.jd-submit:disabled { opacity: 0.35; cursor: not-allowed; }

/* chat input */
.chat-input {
  border-top: 1px solid var(--line);
  padding: 14px 24px 18px;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
}

.chat-input-inner {
  width: 100%;
  max-width: 680px;
  position: relative;
}

.chat-input-inner textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 12px;
  padding: 12px 50px 12px 16px;
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  height: 46px;
  max-height: 120px;
  outline: none;
  transition: border-color 0.15s;
}

.chat-input-inner textarea:focus { border-color: rgba(212,168,83,0.3); }
.chat-input-inner textarea::placeholder { color: var(--t3); }

.chat-send {
  position: absolute;
  right: 10px;
  bottom: 8px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--t2);
  transition: all 0.15s;
}

.chat-send:hover { background: var(--bg4); color: var(--t1); }
.chat-send:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>
<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <span class="topbar-name">Anshu Sharma</span>
    <div class="topbar-links">
      <a href="https://www.linkedin.com/in/anshu-sharma-33b979268/" target="_blank">LinkedIn ↗</a>
      <a href="https://agentic-resume-analyzer.netlify.app/" target="_blank">ResumeIQ ↗</a>
      <a href="mailto:anshusharma27165@gmail.com">Email ↗</a>
    </div>
  </div>

  <div class="views">

    <!-- HOME VIEW -->
    <div id="home-view">
      <div class="greeting">
        <div class="agent-orb"></div>
        <div class="greeting-sub">AI / ML Engineer · Pune, India</div>
        <div class="greeting-main">Hi, I'm Anshu's<br><span>AI assistant.</span></div>
      </div>

      <div class="search-wrap">
        <input
          type="text"
          id="home-input"
          placeholder="Ask anything about Anshu..."
          onkeydown="homeKey(event)"
        />
        <button class="search-send" id="home-send" onclick="homeSubmit()">↑</button>
      </div>

      <div class="cards-label">or get started with</div>

      <div class="cards">
        <button class="card" onclick="cardClick('skills')">
          <div class="card-title">Skills</div>
          <div class="card-sub">Languages, frameworks & AI stack</div>
        </button>
        <button class="card" onclick="cardClick('education')">
          <div class="card-title">Education</div>
          <div class="card-sub">Academic background & scores</div>
        </button>
        <button class="card" onclick="cardClick('projects')">
          <div class="card-title">Projects</div>
          <div class="card-sub">ResumeIQ, Personal Assistant & more</div>
        </button>
        <button class="card resumeiq" onclick="cardClickJD()">
          <div class="card-title">Check fit for your JD →</div>
          <div class="card-sub">Paste a JD to run ATS analysis</div>
        </button>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-view">
      <div class="chat-toolbar">
        <button class="back-btn" onclick="goHome()">← home</button>
        <div class="toolbar-right">
          <button class="qt-btn" onclick="quickBtn('skills')">skills</button>
          <button class="qt-btn" onclick="quickBtn('education')">education</button>
          <button class="qt-btn" onclick="quickBtn('projects')">projects</button>
          <button class="qt-btn acc" onclick="quickJD()">check JD fit →</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="chat-input">
        <div class="chat-input-inner">
          <textarea
            id="chat-inp"
            placeholder="Ask something..."
            onkeydown="chatKey(event)"
            oninput="resizeTA(this)"
          ></textarea>
          <button class="chat-send" id="chat-send" onclick="chatSubmit()">↑</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
let busy = false;
let jdOpen = false;

// ── SESSION ──────────────────────────────────────
function sid() {
  let s = localStorage.getItem('_asid');
  if (!s) {
    s = 'sx' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('_asid', s);
  }
  return s;
}

// ── UTILS ────────────────────────────────────────
function resizeTA(el) {
  el.style.height = '46px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function setBusy(v) {
  busy = v;
  ['chat-send', 'chat-inp', 'home-send'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = v;
  });
}

// ── VIEW SWITCHING ────────────────────────────────
// simple direct style — no classes, no callbacks, no RAF
function showChatView() {
  document.getElementById('home-view').classList.add('gone');
  document.getElementById('chat-view').classList.add('visible');
}

function goHome() {
  document.getElementById('chat-view').classList.remove('visible');
  document.getElementById('home-view').classList.remove('gone');
  document.getElementById('messages').innerHTML = '';
  jdOpen = false;
  busy = false;
  setBusy(false);

  sessionStorage.removeItem('conversation');
    sessionStorage.removeItem('inChat'); 
}

// ── MESSAGES ─────────────────────────────────────
function addMsg(who, text) {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg-wrap ' + who;
  const content = who === 'assistant'
    ? marked.parse(text)
    : text.replace(/\n/g, '<br>');
  d.innerHTML = `
    <div class="msg-label">${who === 'user' ? 'you' : 'anshu.ai'}</div>
    <div class="msg-text">${content}</div>
  `;
  m.appendChild(d);
  scrollBottom();
  saveConversation();
}

function showTyping() {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'typing-wrap _typ';
  d.innerHTML = `<div class="typing-label">anshu.ai</div><div class="dots"><span></span><span></span><span></span></div>`;
  m.appendChild(d);
  scrollBottom();
}

function removeTyping() {
  document.querySelectorAll('._typ').forEach(el => el.remove());
}

// ── KEYBOARD ─────────────────────────────────────
function homeKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); homeSubmit(); }
}

function chatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSubmit(); }
}

// ── HOME SUBMIT ───────────────────────────────────
function homeSubmit() {
  const inp = document.getElementById('home-input');
  const txt = inp.value.trim();
  if (!txt || busy) return;
  inp.value = '';
  showChatView();
  // 100ms gives browser time to fully render chat view
  setTimeout(() => doChat(txt), 100);
}

// ── CHAT SUBMIT ───────────────────────────────────
function chatSubmit() {
  const inp = document.getElementById('chat-inp');
  const txt = inp.value.trim();
  if (!txt || busy) return;
  inp.value = '';
  inp.style.height = '46px';
  doChat(txt);
}

// ── CARD CLICK (from home) ────────────────────────
function cardClick(topic) {
  showChatView();
  setTimeout(() => fetchButton(topic), 100);
}

function cardClickJD() {
  showChatView();
  setTimeout(() => showJD(), 100);
}

// ── QUICK BUTTONS (from toolbar) ──────────────────
function quickBtn(topic) {
  if (busy) return;
  fetchButton(topic);
}

function quickJD() {
  if (busy) return;
  showJD();
}

// ── CHAT API CALL ─────────────────────────────────
async function doChat(txt) {
  addMsg('user', txt);
  showTyping();
  setBusy(true);

  try {
    const response = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: txt, session_id: sid() })
    });

    console.log('Status:', response.status);  // ADD
    console.log('Content-Type:', response.headers.get('content-type'));  // ADD


    removeTyping();
    const msgDiv = addStreamingMsg(); 

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      console.log('Chunk received, done:', done, 'value length:', value?.length);
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      console.log('Buffer:', buffer); 
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            console.log('Parsed data:', data); 
            if (data.text) {
              fullText += data.text;
              updateStreamingMsg(msgDiv, fullText);
            }
            if (data.done) break;
          } catch (e) {
          console.log('Parse error:', e, 'line:', line);
          }
        }
      }
    }

    saveConversation();

  } catch (err) {
    console.log('Fetch error:', err);
    removeTyping();
    addMsg('assistant', 'Something went wrong — please try again.');
  } finally {
    setBusy(false);
  }
}


// ── BUTTON API CALL ───────────────────────────────
async function fetchButton(topic) {
  showTyping();
  setBusy(true);

  try {
    const response = await fetch(`${API}/button`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, session_id: sid() })
    });

    removeTyping();
    const msgDiv = addStreamingMsg();
    const streamer = createWordStreamer(msgDiv);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.text) {
              streamer.push(data.text);  
            }
            if (data.done) {
              streamer.finalize();       
            }
          } catch (e) {
            console.log('Parse error:', e, 'line:', line);  
          }
        }
      }
    }

    saveConversation();

  } catch (err) {
    removeTyping();
    addMsg('assistant', 'Something went wrong — please try again.');
  } finally {
    setBusy(false);
  }
}

function addStreamingMsg() {
  const m = document.getElementById('messages');
  if (!m) {
        console.log('ERROR: messages div not found');
        return null;
    }

    
  const d = document.createElement('div');


  d.className = 'msg-wrap assistant';
  d.innerHTML = `
    <div class="msg-label">anshu.ai</div>
    <div class="msg-text streaming-text"></div>
  `;
  m.appendChild(d);
  scrollBottom();
  return d;
}

function updateStreamingMsg(msgDiv, fullText) {
  const textEl = msgDiv.querySelector('.streaming-text');
  // parse markdown as text streams in
  textEl.innerHTML = marked.parse(fullText);
  scrollBottom();
}

// ── JD PANEL ─────────────────────────────────────
function showJD() {
  if (jdOpen) return;
  jdOpen = true;
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'jd-wrap';
  d.id = 'jd-block';
  d.innerHTML = `
    <div class="jd-label">paste job description</div>
    <textarea id="jd-txt" placeholder="Paste the full JD — requirements, responsibilities, skills needed..."></textarea>
    <button class="jd-submit" onclick="submitJD()">Run ResumeIQ analysis →</button>
  `;
  m.appendChild(d);
  scrollBottom();
  setTimeout(() => {
    const ta = document.getElementById('jd-txt');
    if (ta) ta.focus();
  }, 50);
}

async function submitJD() {
  const jd = document.getElementById('jd-txt').value.trim();
  if (!jd || busy) return;
  document.getElementById('jd-block').remove();
  jdOpen = false;
  addMsg('user', 'JD submitted for analysis');
  addMsg('assistant', 'Running ResumeIQ analysis — this may take up to 30s on first load...');
  setBusy(true);
  try {
    const r = await fetch(`${API}/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_description: jd, session_id: sid() })
    });
    const d = await r.json();
    addMsg('assistant', d.response);
  } catch {
    addMsg('assistant', 'ResumeIQ is waking up — please try again in a moment.');
  } finally {
    setBusy(false);  
  }
}
// save messages to sessionStorage after every message
function saveConversation() {
    const messages = document.getElementById('messages').innerHTML;
    sessionStorage.setItem('conversation', messages);
    sessionStorage.setItem('inChat', 'true');
}

// restore conversation on page load
function restoreConversation() {
    const saved = sessionStorage.getItem('conversation');
    const inChat = sessionStorage.getItem('inChat');
    
    if (saved && inChat === 'true') {
        // restore chat view
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('chat-view').style.display = 'flex';
        // restore messages
        document.getElementById('messages').innerHTML = saved;
        scrollBottom();
    }
}


window.addEventListener('load', restoreConversation);
</script>
</body>
</html>
